oryWeatherDataRepository</text></g><!--class RepositoryFactory--><g class="entity" data-qualified-name="Persistence.RepositoryFactory" data-source-line="124" id="ent0033"><rect fill="#EAEDED" height="69.8203" rx="2.5" ry="2.5" style="stroke:#95A5A6;stroke-width:0.5;" width="287.9775" x="2964.01" y="348.3083"/><ellipse cx="3056.5508" cy="366.2634" fill="#B4A7E5" rx="9" ry="9" style="stroke:#181818;stroke-width:1;"/><path d="M3054.4746,363.6408 L3054.4746,362.2443 L3059.2495,362.2443 L3059.2495,363.6408 L3057.6543,363.6408 L3057.6543,368.8669 L3059.2495,368.8669 L3059.2495,370.2634 L3054.4746,370.2634 L3054.4746,368.8669 L3056.0698,368.8669 L3056.0698,363.6408 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="55.2256" x="3094.136" y="363.943">&#171;external&#187;</text><text fill="#1A1A1A" font-family="sans-serif" font-size="11" font-style="italic" lengthAdjust="spacing" textLength="95.396" x="3074.0508" y="376.8981">RepositoryFactory</text><line style="stroke:#95A5A6;stroke-width:0.5;" x1="2965.01" x2="3250.9875" y1="384.2184" y2="384.2184"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="275.9775" x="2970.01" y="398.8532">+newTransactionalContext() : TransactionalContext</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="254.9229" x="2970.01" y="411.8083">+weatherData(autoTx) : WeatherDataRepository</text></g><g class="entity" data-qualified-name="GMN61" data-source-line="166" id="ent0062"><path d="M1693.89,829.6283 L1693.89,956.224 L1986.1141,956.224 L1986.1141,839.6283 L1976.1141,829.6283 L1693.89,829.6283" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1976.1141,829.6283 L1976.1141,839.6283 L1986.1141,839.6283 L1976.1141,829.6283" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="199.7832" x="1699.89" y="845.263">Strategy port (T8). The reader takes a</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="265.0151" x="1699.89" y="858.2181">WeatherImportRequest (the operator's file or time</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="254.6006" x="1699.89" y="871.1732">window + the resolved area boundary), so a file</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="250.1479" x="1699.89" y="884.1283">reader and an API adapter satisfy one contract.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="271.2241" x="1699.89" y="897.0834">CSV and Open-Meteo are the two concretes; a new</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="253.666" x="1699.89" y="910.0384">source is a new implementation selected by the</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="232.5791" x="1699.89" y="922.9935">factory, controller unedited (OCP, Protected</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="258.5698" x="1699.89" y="935.9486">Variation). A concrete is also an Adapter and the</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="116.6709" x="1699.89" y="948.9037">T9 security boundary.</text></g><g class="entity" data-qualified-name="GMN64" data-source-line="178" id="ent0065"><path d="M1694.46,667.8983 L1694.46,755.6288 L2025.5386,755.6288 L2025.5386,677.8983 L2015.5386,667.8983 L1694.46,667.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M2015.5386,667.8983 L2015.5386,677.8983 L2025.5386,677.8983 L2015.5386,667.8983" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="281.2358" x="1700.46" y="683.533">Adapter for a keyless HTTP source. Imposes a fixed-</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="285.146" x="1700.46" y="696.4881">resolution grid over the area boundary, samples each</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="249.6538" x="1700.46" y="709.4432">cell centroid, maps altitude bands -&gt; pressure</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="310.0786" x="1700.46" y="722.3983">levels, and normalizes into the same RawWeatherReading.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="277.2666" x="1700.46" y="735.3534">HTTP sits behind OpenMeteoClient so unit tests use</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="142.3232" x="1700.46" y="748.3084">canned JSON (no network).</text></g><g class="entity" data-qualified-name="GMN67" data-source-line="187" id="ent0068"><path d="M3277.06,680.8583 L3277.06,742.6786 L3548.933,742.6786 L3548.933,690.8583 L3538.933,680.8583 L3277.06,680.8583" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3538.933,680.8583 L3538.933,690.8583 L3548.933,690.8583 L3538.933,680.8583" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="223.9907" x="3283.06" y="696.493">DIP (TP6): interface owned by the domain,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="233.7393" x="3283.06" y="709.4481">JPA + in-memory impls in persistence.impl,</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="242.2148" x="3283.06" y="722.4032">injected at the console. The batch shares one</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="250.873" x="3283.06" y="735.3583">TransactionalContext via weatherData(autoTx).</text></g><g class="entity" data-qualified-name="GMN70" data-source-line="194" id="ent0071"><path d="M2959.56,674.3783 L2959.56,749.1537 L3242.4492,749.1537 L3242.4492,684.3783 L3232.4492,674.3783 L2959.56,674.3783" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M3232.4492,674.3783 L3232.4492,684.3783 L3242.4492,684.3783 L3232.4492,674.3783" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="247.4302" x="2965.56" y="690.013">Per-record invariants enforced at construction</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="242.376" x="2965.56" y="702.9681">(Preconditions -&gt; IllegalArgumentException);</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="261.8892" x="2965.56" y="715.9232">the controller catches per row and records a skip</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="191.4741" x="2965.56" y="728.8783">(fail-soft, I9). No uniqueness across</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="164.9248" x="2965.56" y="741.8334">(area, zone, band, period) - I8.</text></g><!--link ImportWeatherDataAction to ImportWeatherDataUI--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="dependency" data-source-line="133" id="lnk34"><path codeLine="133" d="M2518,132.6383 C2518,154.6283 2518,179.0483 2518,199.9683" fill="none" id="ImportWeatherDataAction-to-ImportWeatherDataUI" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="2518,205.9683,2522,196.9683,2518,200.9683,2514,196.9683,2518,20