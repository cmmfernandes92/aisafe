125" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="570.9707" x="3033.5293" y="878"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="178.7734" x="3038.5293" y="896.5352">GRASP concepts in US085:</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="475.3301" x="3038.5293" y="913.0234">&#8226; Strategy (T7): FlightPlanTestService &#8212; the controller depends on the</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="450.0371" x="3047.3887" y="929.5117">abstraction; SimulatorV1...Service is the production strategy and a</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="393.791" x="3047.3887" y="946">BasicFlightPlanTestService placeholder is interchangeable.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="531.8428" x="3038.5293" y="962.4883">&#8226; Adapter / Separated Interface (T5) + Indirection (GRASP): FlightPlanCompiler</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="552.1113" x="3047.3887" y="978.9766">is a core-owned port; ConsoleFlightPlanCompiler &amp; DslFlightPlanCompiler supply</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="427.0205" x="3047.3887" y="995.4648">DSL adapters, so aisafe.core stays DSL-unaware (like weather's</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="187.3799" x="3047.3887" y="1011.9531">WeatherDataSourceReader).</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="559.9043" x="3038.5293" y="1028.4414">&#8226; Domain Service (T4): the recompile&#8594;resolve&#8594;physics&#8594;verdict pipeline is owned</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="159.7969" x="3047.3887" y="1044.9297">by no single aggregate.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="488.7422" x="3038.5293" y="1061.418">&#8226; Pure Fabrication + Information Expert: Atmosphere / AircraftPhysics /</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="488.1475" x="3047.3887" y="1077.9063">FuelBurnModel / WindResolver &#8212; stateless &#167;3.3 maths, repository-free.</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="545.207" x="3038.5293" y="1094.3945">&#8226; SegmentKey: one shared (leg 1-based, segment 0-based) derivation so US082</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="411.2227" x="3047.3887" y="1110.8828">attach and US085 resolve cannot drift (Low Coupling / DRY).</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="539.123" x="3038.5293" y="1127.3711">&#8226; DIP / OCP / Protected Variations: a new test engine or DSL front-end plugs in</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="296.7754" x="3047.3887" y="1143.8594">with no change to the controller or domain.</text></g><?plantuml-src hHdRZjl6zPrVCNM0cafNMcyTERQo4S3L9HKixmgYl6c00i68756J9Jd4p52xIkeYJ-rxq2_eI_-Zd-8lwPdXKE9Dsbjas9Ouvtu_mpya70SHHY7UibGY4H69OsnPueR62UOuGbw8XN2av7IPIZBnMEpIdmbwLGMvmDvDm5aQ-mCMCew-6BuPEUEtDJ36VS8DIFVYtSMmMmKPirWQW3D7_Ia09C051yILsv0WJZoGDWX97Q0gZUGu5W11Oja0N9JfhVuKW7oomcaebLHQyxCpQqrzWaYKo2sAIBGaNDGiXdwn47mgSfoVapj9U8p3VXzzCN96mz4mWzkBK8PvrtMwpXiDixDB6SBOg95RmhXKCEF1-FLWNEUKdrzy_QxxwiBwP5alqRUF-03uR3voHvSBPp6vkaJ8nbJW5UdW9EaaD6Io0m4Z63Zh56L7jsJPUYmNuoVqOiQ901TYILaC51qV9s08yS9OExFyWWWv3ccmbhCGnnydvb1z_eHyvgxPhTr2FRHa81UEzU6d0luWatXFOi0Yq8LmT7wECuvWio9HBmEmERuTYb3HhY9hYUT4G23L-07AFRnA3dykuwSusPdDffD1nSSUu