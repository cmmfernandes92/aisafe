FDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M328.7437,44.6094 L328.7437,54.6094 L338.7437,54.6094 L328.7437,44.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="95.96" x="12" y="61.0283">US121 import flow</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="3.0562" x="12" y="74.8643">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="129.6152" x="12" y="88.7002">1. Pilot selects a .flight file.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="226.8159" x="12" y="102.5361">2. System validates it via US120 DSL compiler</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="165.3545" x="21.1685" y="116.3721">(lexical &#226;&#8224;&#8217; syntactic &#226;&#8224;&#8217; semantic).</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="258.6182" x="12" y="130.208">3. If invalid: error messages with phase, line, column.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="157.1206" x="21.1685" y="144.0439">Import is aborted (AC#3, AC#4).</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="258.0005" x="12" y="157.8799">4. If valid: the existing DRAFT FlightPlan of the Flight</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="272.4165" x="21.1685" y="171.7158">(created by US080, identified by route + departure date)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="256.2119" x="21.1685" y="185.5518">has its body superseded with the DSL content and is</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="125.9414" x="21.1685" y="199.3877">promoted to VALIDATED.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="3.0562" x="12" y="213.2236">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="87.4307" x="12" y="227.0596">Status transitions:</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="305.6313" x="18.1123" y="240.8955">DRAFT (US080) -&gt; VALIDATED (US121) -&gt; TESTED (US085)</text></g><!--reverse link Flight to FlightDesignator--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" data-link-type="composition" data-source-line="41" id="lnk17"><path codeLine="41" d="M238.76,534.6094 C302.16,534.6094 395.39,534.6094 458.77,534.6094" fill="none" id="Flight-backto-FlightDesignator" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="226.76,534.6094,232.76,538.6094,238.76,534.6094,232.76,530.6094,226.76,534.6094" style="stroke:#181818;stroke-width:1;"/></g><!--reverse link Flight to FlightPlan--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="composition" data-source-line="42" id="lnk18"><path codeLine="42" d="M238.3485,517.174 C307.2385,498.654 413.93,469.9694 474.25,453.7594" fill="none" id="Flight-backto-FlightPlan" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="226.76,520.2894,233.5927,522.5945,238.3485,517.174,231.5158,514.8688,226.76,520.2894" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="16.5107" x="449.9758" y="468.2624">1..*</text></g><!--reverse link FlightPlan to FlightPlanStatus--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="composition" data-source-line="44" id="lnk19"><path codeLine="44" d="M562.8184,460.9443 C585.8584,469.1243 