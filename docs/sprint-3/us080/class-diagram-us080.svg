L1678.1829,473.625 L1678.1829,390.6094 L1668.1829,380.6094 L1418.18,380.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1668.1829,380.6094 L1668.1829,390.6094 L1678.1829,390.6094 L1668.1829,380.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="239.0029" x="1424.18" y="397.0283">Factory (GoF/DDD): assembles the Flight with its</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="119.813" x="1424.18" y="410.8643">initial DRAFT FlightPlan.</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="146.1421" x="1424.18" y="424.7002">Validates the cross-aggregate</text><text fill="#000000" font-family="sans-serif" font-size="11" font-weight="bold" lengthAdjust="spacing" textLength="72.7246" x="1573.3782" y="424.7002">preconditions</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="124.1152" x="1424.18" y="438.5361">(I2, I3, I5, I6) on its inputs</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="221.6328" x="1424.18" y="452.3721">(Preconditions -&gt; IllegalArgumentException) -</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="215.8589" x="1424.18" y="466.208">an operation no single aggregate owns (T4).</text></g><g class="entity" data-qualified-name="GMN50" data-source-line="148" id="ent0051"><path d="M1140.68,768.6094 L1140.68,847.7891 L1417.5858,847.7891 L1417.5858,778.6094 L1407.5858,768.6094 L1140.68,768.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M1407.5858,768.6094 L1407.5858,778.6094 L1417.5858,778.6094 L1407.5858,768.6094" fill="#FEFFDD" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="80.0884" x="1146.68" y="785.0283">Per-object rules:</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="214.5806" x="1146.68" y="798.8643">- FlightPlan initialized to DRAFT (default, I1)</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="253.5854" x="1146.68" y="812.7002">- Flight invariant "&lt;= 1 VALIDATED plan" (Invariants</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="249.7935" x="1152.7923" y="826.5361">-&gt; IllegalStateException), enforced on validatePlan;</text><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="147.9683" x="1152.7923" y="840.3721">not exercised at draft creation.</text></g><!--link CreateFlightUI to CreateFlightController--><g class="link" data-entity-1="ent0003" data-entity-2="ent0005" data-link-type="dependency" data-source-line="106" id="lnk23"><path codeLine="106" d="M808.18,127.7494 C808.18,153.1294 808.18,187.3194 808.18,216.3694" fill="none" id="CreateFlightUI-to-CreateFlightController" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="808.18,222.3694,812.18,213.3694,808.18,217.3694,804.18,213.3694,808.18,222.3694" style="stroke:#181818;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="23.2354" x="809.18" y="172.0283">uses</text></g><!--link CreateFlightController to AuthorizationService--><g class="link" data-entity-1="ent0005" data-entity-2="ent0022" data-link-type="dependency" data-source-line="108" id="lnk24"><path codeLine="108" d="M915.31,286.9894 C971.94,302.7094 1042.01,324.5894 1102.18,350.6094 C1135.11,364.8494 1165.8035,379.7161 1194.7335,394.3161" fill="none" id="CreateFlightController-to-AuthorizationService" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="1200.09,39