 y="146.0654">domain aggregate (per DTO pattern).</text></g><!--class User--><g class="entity" data-entity="User" data-source-line="19" data-uid="ent0003" id="entity_User"><rect fill="#DDDDDD" height="113.7852" rx="4" ry="4" style="stroke:#AAAAAA;stroke-width:0.5;" width="137.2686" x="285.5" y="23"/><ellipse cx="305.838" cy="53.2715" fill="#ADD1B2" rx="11" ry="11" style="stroke:#181818;stroke-width:1;"/><path d="M308.6037,49.1465 Q308.7599,48.9277 308.9474,48.8184 Q309.1349,48.709 309.3537,48.709 Q309.7287,48.709 309.963,48.9746 Q310.1974,49.2246 310.1974,49.834 L310.1974,51.2871 Q310.1974,51.8965 309.963,52.1621 Q309.7287,52.4277 309.3537,52.4277 Q309.0099,52.4277 308.8068,52.2246 Q308.6037,52.0371 308.4943,51.5215 Q308.4474,51.1621 308.2599,50.9746 Q307.9318,50.5996 307.3224,50.3809 Q306.713,50.1621 306.088,50.1621 Q305.3224,50.1621 304.6818,50.4902 Q304.0568,50.8184 303.5568,51.5684 Q303.0724,52.3184 303.0724,53.3496 L303.0724,54.4434 Q303.0724,55.6777 303.963,56.5059 Q304.8537,57.3184 306.4474,57.3184 Q307.3849,57.3184 308.0412,57.0684 Q308.4318,56.9121 308.8537,56.4746 Q309.1193,56.209 309.2599,56.1309 Q309.4162,56.0527 309.6193,56.0527 Q309.9474,56.0527 310.1974,56.3184 Q310.463,56.5684 310.463,56.9121 Q310.463,57.2559 310.1193,57.6621 Q309.6193,58.2402 308.8224,58.5684 Q307.7443,59.0215 306.4474,59.0215 Q304.9318,59.0215 303.7287,58.3965 Q302.7443,57.8965 302.0568,56.834 Q301.3693,55.7559 301.3693,54.4746 L301.3693,53.3184 Q301.3693,51.9902 301.9787,50.8496 Q302.6037,49.6934 303.6974,49.084 Q304.7912,48.459 306.0255,48.459 Q306.7599,48.459 307.4005,48.6309 Q308.0568,48.7871 308.6037,49.1465 Z " fill="#000000"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="97.4063" x="319.0243" y="40.9492">&#171;Aggregate Root&#187;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="70.7891" x="332.3329" y="57.9893">SystemUser</text><text fill="#000000" font