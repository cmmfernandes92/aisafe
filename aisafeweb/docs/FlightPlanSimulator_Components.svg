a-source-line="68" id="ent0030"><path d="M739,879.5039 L739,958.9727 A3,3 0 0 0 742,961.9727 L1236.1406,961.9727 A3,3 0 0 0 1239.1406,958.9727 L1239.1406,886.5039 L1229.1406,876.5039 L742,876.5039 A3,3 0 0 0 739,879.5039" fill="#FFFDF0" style="stroke:#D8C97A;stroke-width:0.5;"/><path d="M1229.1406,876.5039 L1229.1406,885.0039 A1.5,1.5 0 0 0 1230.6406,886.5039 L1239.1406,886.5039 L1229.1406,876.5039" fill="#FFFDF0" style="stroke:#D8C97A;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="462.3926" x="745" y="902.2656">Fully client-side rendering: the server delivers HTML</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="479.1406" x="745" y="927.4219">and static JS only. All motion, geometry and rendering</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="165.6348" x="745" y="952.5781">run in the browser.</text></g><g class="entity" data-qualified-name="GMN32" data-source-line="74" id="ent0033"><path d="M1359,428.5039 L1359,558.2852 A3,3 0 0 0 1362,561.2852 L1930.1445,561.2852 A3,3 0 0 0 1933.1445,558.2852 L1933.1445,435.5039 L1923.1445,425.5039 L1362,425.5039 A3,3 0 0 0 1359,428.5039" fill="#FFFDF0" style="stroke:#D8C97A;stroke-width:0.5;"/><path d="M1923.1445,425.5039 L1923.1445,434.0039 A1.5,1.5 0 0 0 1924.6445,435.5039 L1933.1445,435.5039 L1923.1445,425.5039" fill="#FFFDF0" style="stroke:#D8C97A;stroke-width:1;"/><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="553.1445" x="1365" y="451.2656">Today the engine uses a hardcoded LPPR&#8594;LPPT route with a</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="480.3027" x="1365" y="476.4219">scripted altitude profile. The planned hook loads a real</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="490.2148" x="1365" y="501.5781">flight plan server-side (DSL parse or persisted domain),</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="490.2734" x="1365" y="526.7344">serializes it to JSON, and feeds it to the engine in place</text><text fill="#000000" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="325.7324" x="1365" y="551.8906">of the straight-line lerp and altProfile.</text></g><!--link user to controller--><g class="link" data-entity-1="ent0002" data-entity-2="ent0005" data-link-type="dependency" data-source-line="54" id="lnk17"><path d="M394.05,161.9739 C384.07,181.3839 369.99,203.3639 352,218.5039 C336.69,231.3939 323.6986,239.2458 305.0286,247.3058" fill="none" id="user-to-controller" style="stroke:#5A6B7B;stroke-width:1;"/><polygon fill="#5A6B7B" points="299.52,249.6839,309.3683,249.7891,304.1105,247.7022,306.1975,242.4443,299.52,249.6839" style="stroke:#5A6B7B;stroke-width:1;"/><text fill="#5A6B7B" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="98.8867" x="376" y="213.2656">HTTP GET</text></g><!--link module to controller--><g class="link" data-entity-1="ent0004" data-entity-2="ent0005" data-link-type="dependency" data-source-line="55" id="lnk18"><path d="M146.51,147.5739 C159.22,176.0639 176.3262,214.4341 189.0362,242.9341" fill="none" id="module-to-controller" style="stroke:#5A6B7B;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#5A6B7B" points="191.48,248.4139,191.4675,238.5651,189.4435,243.8474,184.1611,241.8234,191.48,248.4139" style="stroke:#5A6B7B;stroke-width:1;"/><text fill="#5A6B7B" font-family="'Helvetica'" font-size="20" lengthAdjust="spacing" textLength="164.5117" x="179" y="213.2656">registers nav entry</text></g><!--link controller to template--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="56" id="lnk19"><path d="M149.5,306.5439 C138.84,314.6939 129.09,324.6539 123,33