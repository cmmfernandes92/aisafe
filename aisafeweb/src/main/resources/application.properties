server.port=8081
spring.application.name=aisafeweb
spring.thymeleaf.cache=false

aisafeweb.bootstrap.enabled=false
aisafeweb.scomp.binary=scomp/sprint-3/flight_sim/flight_sim
aisafeweb.scomp.runsRoot=scomp/sprint-3/flight_sim/runs
aisafeweb.scomp.timeoutSeconds=120

persistence.repositoryFactory=eapli.aisafe.persistence.impl.jpa.JpaRepositoryFactory
ui.menu.layout=horizontal
persistence.persistenceUnit=eapli.aisafe

# Enable only when intentionally recreating/bootstraping the local AISafe DB.
