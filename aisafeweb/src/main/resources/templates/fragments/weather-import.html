<div th:fragment="result" th:class="${success} ? 'alert ok weather-import-result' : 'alert error weather-import-result'" role="status">
  <div th:if="${success}">
    <strong th:text="|Imported ${report.imported()}, skipped ${report.skipped()}|">Imported 0, skipped 0</strong>
    <ul th:if="${report.skipped() > 0}" class="weather-import-errors">
      <li th:each="error : ${report.errors()}">
        <span class="mono" th:text="|line ${error.line()}|">line 2</span>
        <span th:text="${error.reason()}">Invalid row</span>
      </li>
    </ul>
  </div>
  <span th:unless="${success}" th:text="${message}">Import failed.</span>
</div>
