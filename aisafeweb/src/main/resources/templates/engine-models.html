<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AISafe - Engine Models</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="/css/app.css?v=20260602-routes-toggle">
</head>
<body class="app-shell">
  <div th:replace="~{layout :: topbar(${username}, ${currentModule}, ${modules})}"></div>
  <div class="layout">
    <div th:replace="~{layout :: sidebar('engine-models', ${currentModule}, ${navItems})}"></div>

    <main class="content">
      <header class="page-head">
        <div>
          <p class="eyebrow">Reference Data</p>
          <h1>Engine Models</h1>
          <p class="page-copy">Register and inspect engine models by motorization type, fuel type, thrust, and efficiency.</p>
        </div>
      </header>

      <section class="areas-grid">
        <article th:replace="~{fragments/table-card :: card(
            'Registered Engine Models',
            '/engine-models/table',
            '#engine-models-tbody',
            'Refresh engine models',
            ~{::#engine-models-head},
            ~{fragments/engine-models :: rows(${snapshot.engineModels()})})}">
          <thead id="engine-models-head">
          <tr>
            <th>Name</th>
            <th>Maker</th>
            <th>Motorization</th>
            <th>Fuel</th>
            <th>Power (N)</th>
            <th>Efficiency (TSFC)</th>
          </tr>
          </thead>
        </article>

        <aside class="card form-card">
          <div class="card-head">
            <h2>Create Engine Model</h2>
            <span>POST /engine-models</span>
          </div>
          <div id="form-result"></div>
          <form hx-post="/engine-models" hx-target="#form-result" hx-swap="innerHTML" class="stack">
            <label>
              <span>Engine Model Name</span>
              <input name="engineModelName" required maxlength="64" placeholder="CFM56-5B">
            </label>

            <label>
              <span>Maker</span>
              <select name="makerName" required>
                <option value="">Select maker</option>
                <option th:each="maker : ${snapshot.makers()}"
                        th:value="${maker.identity()}"
                        th:text="${maker.identity()}">CFM International</option>
              </select>
            </label>

            <div class="form-grid">
              <label>
                <span>Motorization Type</span>
                <select name="motorizationType" required>
                  <option value="">Select type</option>
                  <option th:each="mt : ${motorizationTypes}"
                          th:value="${mt}"
                          th:text="${mt}">TURBOFAN</option>
                </select>
              </label>

              <label>
                <span>Fuel Type</span>
                <select name="fuelType" required>
                  <option value="">Select fuel</option>
                  <option th:each="ft : ${fuelTypes}"
                          th:value="${ft}"
                          th:text="${ft}">JET_A1</option>
                </select>
              </label>
            </div>

            <div class="form-grid">
              <label>
                <span>Power (Newtons)</span>
                <input name="power" type="number" step="0.1" min="0.001" required placeholder="121400">
              </label>
              <label>
                <span>Efficiency (TSFC)</span>
                <input name="efficiency" type="number" step="0.0001" min="0.0001" required placeholder="0.0370">
              </label>
            </div>

            <button type="submit">Create Engine Model</button>
          </form>
        </aside>
      </section>
    </main>
  </div>
  <script src="/js/sidebar.js"></script>
  <script src="/js/sortable-table.js"></script>
</body>
</html>
