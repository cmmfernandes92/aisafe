<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AISafe · Remote Accesses Logging Server</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #070b14;
            --panel: #101827;
            --line: #27324d;
            --line-soft: rgba(58, 70, 100, 0.48);
            --text: #e5ecf7;
            --muted: #94a3b8;
            --muted-2: #64748b;
            --cyan: #00e5ff;
            --purple: #7b61ff;
            --pink: #ff4d9d;
            --green: #3ee6a8;
            --red: #fb7185;
            --amber: #ffb547;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            font-family: Inter, system-ui, sans-serif;
            color: var(--text);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            background-image:
                linear-gradient(rgba(123,97,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
            background-size: 48px 48px;
        }
        .backdrop {
            position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(70% 60% at 22% 18%, rgba(0,229,255,0.12), transparent 62%),
                radial-gradient(70% 60% at 82% 78%, rgba(123,97,255,0.12), transparent 62%),
                radial-gradient(55% 40% at 88% 16%, rgba(255,77,157,0.08), transparent 70%);
        }
        .topbar {
            position: sticky; top: 0; z-index: 20;
            height: 64px; display: flex; align-items: center; gap: 12px;
            padding: 0 22px;
            border-bottom: 1px solid rgba(39,50,77,0.8);
            background: rgba(12,18,32,0.88);
            backdrop-filter: blur(10px);
        }
        .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); }
        .brand img { width: 40px; height: 40px; object-fit: contain; }
        .brand strong { font: 400 1.3rem Inter, sans-serif; letter-spacing: 0.06em; line-height: 1; }
        .brand i { color: var(--pink); font-style: normal; }
        .topbar .crumb {
            margin-left: 6px; color: var(--muted-2);
            font: 500 0.66rem "JetBrains Mono", monospace; letter-spacing: 0.14em; text-transform: uppercase;
        }
        .topbar .live {
            margin-left: auto; display: inline-flex; align-items: center; gap: 8px;
            font: 600 0.7rem "JetBrains Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
        }
        .dot { width: 8px; height: 8px; border-radius: 999px; background: var(--green); box-shadow: 0 0 12px rgba(62,230,168,0.8); animation: pulse 1.8s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

        main { position: relative; z-index: 1; max-width: 1160px; margin: 0 auto; padding: 34px 22px 60px; }
        .eyebrow { color: var(--cyan); font: 700 0.72rem "JetBrains Mono", monospace; letter-spacing: 0.18em; text-transform: uppercase; }
        h1 { margin: 8px 0 4px; font: 600 2.1rem Poppins, sans-serif; letter-spacing: -0.02em; }
        .lede { margin: 0 0 28px; color: var(--muted); font-size: 0.95rem; max-width: 60ch; }

        .grid { display: grid; grid-template-columns: 1fr 1.35fr; gap: 20px; align-items: start; }
        @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }

        .card {
            position: relative;
            background: linear-gradient(180deg, rgba(30,41,59,0.62), rgba(19,28,54,0.62));
            border: 1px solid rgba(58,70,100,0.46);
            border-radius: 10px;
            padding: 18px;
            backdrop-filter: blur(6px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.18);
            opacity: 0; transform: translateY(10px);
            animation: rise 0.5s cubic-bezier(0.22,1,0.36,1) forwards;
        }
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.16s; }
        @keyframes rise { to { opacity: 1; transform: none; } }

        .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
        .card-head h2 { margin: 0; font: 600 0.78rem "JetBrains Mono", monospace; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted-2); }
        .card-head .accent { width: 6px; height: 18px; border-radius: 3px; }
        .accent.cyan { background: var(--cyan); box-shadow: 0 0 12px rgba(0,229,255,0.5); }
        .accent.purple { background: var(--purple); box-shadow: 0 0 12px rgba(123,97,255,0.5); }
        .count { margin-left: auto; min-width: 26px; text-align: center; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line-soft); color: var(--muted); font: 600 0.72rem "JetBrains Mono", monospace; }

        /* tables come from the AJAX fragments (/events, /active) */
        table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
        th, td { padding: 9px 10px; border-bottom: 1px solid rgba(39,50,77,0.7); text-align: left; white-space: nowrap; }
        th { color: var(--muted); font: 600 0.66rem "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: 0.09em; background: rgba(123,97,255,0.06); }
        tbody td, tr td { color: var(--text); }
        td { font-family: "JetBrains Mono", monospace; font-size: 0.78rem; color: var(--muted); }
        tr:hover td { background: rgba(0,229,255,0.06); }
        p { color: var(--muted); font-size: 0.85rem; margin: 6px 2px; }

        /* coloured chips (classes applied by rcomp-ajax.js, no server change) */
        .badge { display: inline-block; padding: 2px 9px; border-radius: 6px; font: 600 0.72rem "JetBrains Mono", monospace; letter-spacing: 0.04em; border: 1px solid transparent; }
        .ev-login_ok   { color: var(--green);  background: rgba(62,230,168,0.12);  border-color: rgba(62,230,168,0.32); }
        .ev-login_fail { color: var(--pink);   background: rgba(255,77,157,0.12);  border-color: rgba(255,77,157,0.34); }
        .ev-logout     { color: var(--amber);  background: rgba(255,181,71,0.12);  border-color: rgba(255,181,71,0.32); }
        .ev-disconnect { color: var(--red);    background: rgba(251,113,133,0.12); border-color: rgba(251,113,133,0.30); }
        .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; font: 600 0.7rem "JetBrains Mono", monospace; letter-spacing: 0.06em; }
        .svc-weather { color: var(--cyan);   background: rgba(0,229,255,0.1);  border: 1px solid rgba(0,229,255,0.3); }
        .svc-pilot   { color: var(--purple); background: rgba(123,97,255,0.12); border: 1px solid rgba(123,97,255,0.34); }
        .svc-atc     { color: var(--pink);   background: rgba(255,77,157,0.1);  border: 1px solid rgba(255,77,157,0.3); }
    </style>
</head>
